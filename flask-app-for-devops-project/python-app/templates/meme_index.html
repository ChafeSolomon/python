<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Meme Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 80%;
            max-width: 600px;
        }

        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 15px;
        }

        .meme {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 20px;
        }

        .subreddit {
            font-size: 16px;
            color: #888;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                width: 100%;
                padding: 15px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Random Meme Viewer</h1>
        <p>Here is your meme! This will update in 30 seconds</p>
        <p><img class="meme" src="{{meme_pic}}" alt="Random Meme"></p>
        <p class="subreddit">Current subreddit: {{subreddit}}</p>
    </div>
</body>
</html>
